# リポジトリ全体で使うタスクと、その道具 (ktlint) を置く。
# Swift の版はここでは決めない (iOS は Xcode の Swift、Android は Android/mise.toml の Swift を使う。どちらにも swift-format が入っている)
#
#   mise run lint     # Swift と Kotlin のコードの書き方を確かめる (Swift は swift-format・設定は .swift-format、Kotlin は ktlint・設定は .editorconfig)
#   mise run format   # Swift と Kotlin のコードの書き方を直す
#   mise run check    # 全部を確かめる (書き方・Swift のテスト・iOS と Android のビルド・振る舞いのテスト)。CI も同じタスクを流す

# 複数行のタスクは bash で動かす (mise の既定の sh は、Linux では dash で、set -o pipefail を知らない)

[tools]
# Kotlin のコードの書き方を確かめて直す (設定は .editorconfig)。Swift の swift-format は Swift のツールチェーンに入っているので入れない
ktlint = "1.8.0"

[tasks.lint]
description = "Swift と Kotlin のコードの書き方を確かめる (直すべきところがあれば止まる)"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
# 道具が作るファイル (Generated/) は対象にしない。.build/ などの Git に入れないものは、Git の一覧に出ないので外れる
git ls-files --cached --others --exclude-standard '*.swift' | grep -v '/Generated/' | xargs swift format lint --strict --parallel
git ls-files --cached --others --exclude-standard '*.kt' '*.kts' | xargs ktlint --relative
'''

[tasks.format]
description = "Swift と Kotlin のコードの書き方を直す"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files --cached --others --exclude-standard '*.swift' | grep -v '/Generated/' | xargs swift format --in-place --parallel
git ls-files --cached --others --exclude-standard '*.kt' '*.kts' | xargs ktlint --format --relative
'''

[tasks.test-swift]
description = "Swift のパッケージのテストを全部流す (test-swift-shared と test-swift-apple)"
dir = "{{ config_root }}"
run = "mise run test-swift-shared && mise run test-swift-apple"

[tasks.generate-mocks]
description = "Mockolo で Repository・UseCase のテスト用モックを再生成する"
dir = "{{ config_root }}"
run = "swift run --package-path Tools/GenerateMocks -c release GenerateMocks"

[tasks.test-swift-shared]
description = "Apple の環境がなくても流せる Swift のパッケージのテスト (共有の部分・Android の窓口・つなぎを作る道具)。Linux でも流す"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
for package in Packages/RegzaCore Android/RegzaAndroidBridge Android/ScreenGlue; do
  echo "== $package"
  (cd "$package" && swift test)
done
'''

[tasks.test-swift-apple]
description = "Apple の環境 (Xcode) が要る Swift のパッケージのテスト (iOS の部品)"
dir = "{{ config_root }}/iOS/RegzaKit"
run = "swift test"

[tasks.build-ios]
description = "iOS のアプリとウィジェットをシミュレーター向けにビルドする (署名はしない)"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
xcodebuild -project iOS/RegzaRemote.xcodeproj -scheme RegzaRemote -destination 'generic/platform=iOS Simulator' \
  -quiet CODE_SIGNING_ALLOWED=NO build
'''

[tasks.build-android]
description = "Android のアプリを debug と release でビルドする (release は APK の中身も確かめる)。Android/mise.toml の道具を使う"
dir = "{{ config_root }}/Android"
run = "mise exec -- ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest"

[tasks.test-behavior]
description = "振る舞いのテストを流す (iOS 側の regza と Android 側の regza-android の両方)"
dir = "{{ config_root }}/BehaviorTests"
run = "mise run test"

[tasks.check]
description = "全部を確かめる (書き方・Swift のテスト・iOS と Android のビルド・振る舞いのテスト)。1 つずつ順に流す"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
for task in lint test-swift build-ios build-android test-behavior; do
  echo "==== $task"
  mise run "$task"
done
'''
