# リポジトリ全体で使うタスクと、その道具 (ktlint) を置く。
# Swift・Xcode の版は toolchains.toml で管理する。iOS は Xcode、Android・Linux は swift.org のコンパイラを使う。
#
#   mise run lint     # Swift と Kotlin のコードの書き方を確かめる (Swift は swift-format・設定は .swift-format、Kotlin は ktlint・設定は .editorconfig)
#   mise run format   # Swift と Kotlin のコードの書き方を直す
#   mise run check    # 全部を確かめる (書き方・Swift のテスト・iOS と Android のビルド・振る舞いのテスト)。CI も同じタスクを流す

# 複数行のタスクは bash で動かす (mise の既定の sh は、Linux では dash で、set -o pipefail を知らない)

[tools]
# Kotlin のコードの書き方を確かめて直す (設定は .editorconfig)。Swift の swift-format は Swift のツールチェーンに入っているので入れない
ktlint = "{{ vars.ktlint }}"

[vars]
ktlint = "1.8.0"
swift = "{{ read_toml(path='toolchains.toml')['swift']['version'] }}"
xcode = "{{ read_toml(path='toolchains.toml')['xcode']['version'] }}"

[tasks.select-ci-xcode]
description = "GitHub Actions の後続ステップで、共通設定の Xcode を使う"
dir = "{{ config_root }}"
run = 'echo "DEVELOPER_DIR=/Applications/Xcode_{{ vars.xcode }}.app/Contents/Developer" >> "${GITHUB_ENV:?GitHub Actions の GITHUB_ENV が必要です}"'

[tasks.check-apple-toolchain]
description = "Xcode の版と、Apple Swift が Android・Linux と同じ系列であることを確認する"
dir = "{{ config_root }}"
run = "bash scripts/check-toolchain.sh apple {{ vars.swift }} {{ vars.xcode }}"

[tasks.check-swift-toolchain]
description = "swift.org のコンパイラが toolchains.toml の指定版と一致することを確認する"
dir = "{{ config_root }}"
run = "bash scripts/check-toolchain.sh swift {{ vars.swift }}"

[tasks.lint]
description = "Swift・Kotlin の書き方と Android の依存方向を確かめる"
depends = ["build-ktlint-rules"]
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
# 道具が作るファイル (Generated/) は対象にしない。.build/ などの Git に入れないものは、Git の一覧に出ないので外れる
git ls-files --cached --others --exclude-standard '*.swift' | grep -v '/Generated/' | xargs swift format lint --strict --parallel
git ls-files --cached --others --exclude-standard '*.kt' '*.kts' | xargs ktlint --relative --ruleset=Tools/KtlintRules/build/libs/regza-ktlint-rules.jar
'''

[tasks.build-ktlint-rules]
description = "ktlint の依存方向ルールをビルドし、回帰テストを実行する (Android SDK は不要)"
dir = "{{ config_root }}"
run = [
    "./Android/gradlew -p Tools/KtlintRules -PktlintVersion={{ vars.ktlint }} test jar --console=plain",
]

[tasks.format]
description = "Swift と Kotlin のコードの書き方を直す"
depends = ["build-ktlint-rules"]
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
git ls-files --cached --others --exclude-standard '*.swift' | grep -v '/Generated/' | xargs swift format --in-place --parallel
git ls-files --cached --others --exclude-standard '*.kt' '*.kts' | xargs ktlint --format --relative --ruleset=Tools/KtlintRules/build/libs/regza-ktlint-rules.jar
'''

[tasks.test-swift]
description = "Swift のパッケージのテストを全部流す (test-swift-shared と test-swift-apple)"
dir = "{{ config_root }}"
run = "mise run test-swift-shared && mise run test-swift-apple"

[tasks.generate-mocks]
description = "Mockolo で Repository・UseCase のテスト用モックを再生成する"
dir = "{{ config_root }}"
run = "swift run --package-path Tools/GenerateMocks -c release GenerateMocks"

[tasks.test-swift-shared]
description = "Apple の環境がなくても流せる Swift のパッケージのテスト (共有の部分・Android の窓口・つなぎを作る道具)。Linux でも流す"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
for package in Packages/RegzaCore Android/RegzaAndroidBridge Android/ScreenGlue; do
  echo "== $package"
  (cd "$package" && swift test)
done
'''

[tasks.test-swift-apple]
description = "Apple の環境 (Xcode) が要る Swift のパッケージのテスト (iOS の部品)"
dir = "{{ config_root }}/iOS/RegzaKit"
depends = ["check-apple-toolchain"]
run = "swift test"

[tasks.build-ios]
description = "iOS のアプリとウィジェットをシミュレーター向けにビルドする (署名はしない)"
dir = "{{ config_root }}"
depends = ["check-apple-toolchain"]
shell = "bash -c"
run = '''
set -euo pipefail
xcodebuild -project iOS/RegzaRemote.xcodeproj -scheme RegzaRemote -destination 'generic/platform=iOS Simulator' \
  -quiet CODE_SIGNING_ALLOWED=NO build
'''

[tasks.build-android]
description = "Android のアプリを debug と release でビルドする (release は APK の中身も確かめる)。Android/mise.toml の道具を使う"
dir = "{{ config_root }}/Android"
run = "mise exec -- ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest"

[tasks.test-android-runtime]
description = "接続済みの arm64 端末で JNI・通信・画面の購読ライフサイクルをテストする (Android API 28 以上)"
dir = "{{ config_root }}/Android"
run = "mise exec -- ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.regzaremote.AndroidRuntimeSmokeTest,com.example.regzaremote.StateLifecycleTest,com.example.regzaremote.TLSTransportTest"

[tasks.prepare-android-preview]
description = "Android Studio のプレビュー用に、ホストの Swift ライブラリを作る (macOS・Linux)"
dir = "{{ config_root }}/Android"
run = "mise exec -- ./gradlew :behavior-tests:buildJvmHost"

[tasks.test-behavior]
description = "振る舞いのテストを流す (iOS 側の regza と Android 側の regza-android の両方)"
dir = "{{ config_root }}/BehaviorTests"
run = "mise run test"

[tasks.check]
description = "全部を確かめる (書き方・Swift のテスト・iOS と Android のビルド・振る舞いのテスト)。1 つずつ順に流す"
dir = "{{ config_root }}"
shell = "bash -c"
run = '''
set -euo pipefail
for task in lint test-swift build-ios build-android test-behavior; do
  echo "==== $task"
  mise run "$task"
done
'''
