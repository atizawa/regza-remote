appId: ${APP_ID}
name: バックグラウンドと終了後の入力復元
---
- runFlow: ../shared/launch.yaml
- runFlow: ../shared/open-tv-settings.yaml
- tapOn:
    id: settings.tv.host
- eraseText
- inputText: 192.0.2.88
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- pressKey: Home
- launchApp:
    stopApp: false
    arguments:
      UITestServer: ${TEST_SERVER}
- assertVisible:
    id: settings.tv.host
- assertVisible: 192.0.2.88
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
    arguments:
      UITestServer: ${TEST_SERVER}
- assertVisible:
    id: settings.tv.host
- assertVisible: 192.0.2.88
