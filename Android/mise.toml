# Android 版の開発に使う道具。このフォルダの中でだけ Swift を swift.org 版にする
# (iOS の作業では Xcode の Swift を使うので、リポジトリ全体には置かない)
#
#   cd Android
#   mise install                        # Swift のツールチェーン・JDK・Android CLI
#   mise run setup-android-sdk          # 初回だけ: Android SDK を用意し、ライセンスに同意する
#   mise run install-android-swift-sdk  # 初回だけ: Swift SDK for Android
#   ./gradlew :app:assembleDebug        # 残りの部品 (platform・build-tools・NDK) は Gradle が入れる
#
# 版を決めている場所:
# - Swift・Swift SDK for Android・iOS の Xcode: ../toolchains.toml
# - JDK: gradle/gradle-daemon-jvm.properties (mise もここから読む)
# - Android NDK: app/build.gradle.kts の ndkVersion (Swift SDK for Android は版 27 以上が要る)
#
# 複数行のタスクは bash で動かす (mise の既定の sh は、Linux では dash で、set -o pipefail を知らない)

[vars]
# 共通設定を参照する。コンパイラと Android SDK の版を別々に指定しない。
swift = "{{ read_toml(path='../toolchains.toml')['swift']['version'] }}"
swift_android_sdk_checksum = "{{ read_toml(path='../toolchains.toml')['swift']['android_sdk_checksum'] }}"
# Android Studio の標準の場所。既存の環境変数があればそちらを優先する。
android_sdk_default = "{% if os() == 'macos' %}{{ env.HOME }}/Library/Android/sdk{% else %}{{ env.HOME }}/Android/Sdk{% endif %}"
android_sdk = "{{ get_env(name='ANDROID_HOME', default=get_env(name='ANDROID_SDK_ROOT', default=vars.android_sdk_default)) }}"

[tools]
swift = "{{ vars.swift }}"
# Gradle を動かす JDK と同じ版 (./gradlew の起動にも使う)
java = "temurin-{{ exec(command='sed -n s/^toolchainVersion=//p gradle/gradle-daemon-jvm.properties') }}"
# Android SDK を用意する Android CLI (android) を使うためだけに入れる (SDK そのものは ANDROID_HOME に置く)
android-sdk = "23.0"
# Gradle wrapper (gradlew) を作るときだけ使う。ふだんのビルドは ./gradlew で行う
gradle = "9.8.2"

[env]
# Android SDK の場所。設定されていなければ Android Studio と同じ標準の場所にする
# (android-sdk のツールは自分の置き場を設定するので、ここで上書きする)
ANDROID_HOME = "{{ vars.android_sdk }}"
ANDROID_SDK_ROOT = "{{ vars.android_sdk }}"
# adb を使えるようにする
_.path = ["{{ vars.android_sdk }}/platform-tools"]

[tasks.setup-android-sdk]
description = "ANDROID_HOME に Android SDK を用意し、ライセンスに同意する (Android Studio がなくてもビルドできるようにする)"
# 同意するかをその場で聞くので、入力をつなぐ
raw = true
shell = "bash -c"
run = '''
set -euo pipefail
# 新しい Android CLI (sdkmanager はその古い呼び方) は、部品を入れるとライセンスに同意したことになり、
# 同意の確認を出さない (sdkmanager --licenses も何もしない)。そこで、入れる前に自分で確かめて同意してもらう
echo "Android SDK を $ANDROID_HOME に用意します。"
echo "SDK の部品を入れると、次のライセンスに同意したものとみなされます (このあと Gradle が入れる platform・build-tools・NDK も含みます)。"
echo "  https://developer.android.com/studio/terms"
[ -t 0 ] || { echo "同意の入力が必要です。ターミナルから実行してください。" >&2; exit 1; }
read -r -p "ライセンスを読んで同意する場合は yes と入力してください: " answer
[ "$answer" = yes ] || { echo "中止しました。"; exit 1; }
mkdir -p "$ANDROID_HOME"
android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools
echo "Android SDK を用意しました: $ANDROID_HOME"
'''

[tasks.install-android-swift-sdk]
description = "Swift SDK for Android を入れる (ツールチェーンと同じ版)"
shell = "bash -c"
run = '''
set -euo pipefail
. scripts/swift-toolchain.sh
resolve_swift_toolchain "{{ vars.swift }}"
if "$SWIFT_COMMAND" sdk list | grep -Fxq "swift-{{ vars.swift }}-RELEASE_android"; then
  echo "Swift SDK for Android {{ vars.swift }} はインストール済みです。"
else
  "$SWIFT_COMMAND" sdk install https://download.swift.org/swift-{{ vars.swift }}-release/android-sdk/swift-{{ vars.swift }}-RELEASE/swift-{{ vars.swift }}-RELEASE_android.artifactbundle.tar.gz --checksum {{ vars.swift_android_sdk_checksum }}
fi
'''

[tasks.build-jvm-host]
description = "窓口とつなぎを、ホストの JVM から読み込む共有ライブラリにする (macOS・Linux)。Android 向けと同じ Swift でビルドする"
shell = "bash -c"
run = '''
set -euo pipefail
. scripts/swift-toolchain.sh
resolve_swift_toolchain "{{ vars.swift }}"
"$SWIFT_COMMAND" build --jobs "${SWIFT_BUILD_JOBS:-2}" --package-path RegzaAndroid --scratch-path .build/jvm-host --product RegzaJVMHost
'''

[tasks.build-swift]
description = "RegzaAndroid を arm64 向けにビルドし (swift-java が Java のクラスも作る)、Swift の実行に要る .so と一緒に app の jniLibs に入れる"
# 中身は scripts/build-swift.sh (シェルとして書き、確かめられるように分けてある)
run = "scripts/build-swift.sh {{ vars.swift }}"

