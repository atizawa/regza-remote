# main への push と pull request で、手元の mise run check と同じものを流す。
# どのジョブも、ルートの mise.toml のタスクを呼ぶだけにする (手元と CI で、同じ手順を使う)。
# Apple の環境がなくても流せるもの (書き方・共有の部分のテスト) は Linux で流し、
# Xcode や、Mac 向けのライブラリが要るもの (iOS のビルド・Android のビルド・振る舞いのテスト) だけを macOS で流す
name: check

on:
  push:
    branches: [main]
  pull_request:
  # GitHub の Actions の画面の「Run workflow」から手で動かす (android のジョブは、手で動かしたときだけ流す)
  workflow_dispatch:

# 同じブランチに続けて push したら、前の実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # リポジトリの mise.toml を、確認なしで信頼する (CI では人が答えられない)
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # Swift と Kotlin の書き方 (swift-format と ktlint)
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENV: linux
    steps:
      - uses: actions/checkout@v7
      # コンテナの DNS に依存せず、ホストに Swift を入れる。Java・curl は runner のものを使う。
      # mise.linux.toml が toolchains.toml の Swift を指定する。
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-${{ hashFiles('toolchains.toml') }}
      - run: mise run check-swift-toolchain
      - run: mise run lint

  # Apple の環境がなくても流せる Swift のパッケージのテスト (Android に近い Linux の Foundation で確かめる)
  swift-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENV: linux
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-${{ hashFiles('toolchains.toml') }}
      - run: mise run check-swift-toolchain
      - run: mise run test-swift-shared

  # Xcode が要るもの: iOS の部品のテストと、iOS のアプリのビルド
  apple:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run select-ci-xcode
      - run: mise run test-swift-apple
      - run: mise run build-ios

  # Android のアプリのビルド (Swift の .so と、プレビュー用の Mac 向けのライブラリも作る) と、両方の相手に流す振る舞いのテスト。
  # 毎回 Swift を最初からビルドするので 30 分ほどかかる。いったん、手で動かしたときだけ流す (push と pull request では流さない)
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # Android/mise.toml の道具 (swift.org の Swift・JDK・Android CLI) と、ルートの道具を入れる
      - uses: jdx/mise-action@v5
        with:
          working_directory: Android
          cache_key_prefix: mise-${{ hashFiles('toolchains.toml') }}
      - run: mise run select-ci-xcode
      - run: mise run check-apple-toolchain
      # Swift SDK for Android は大きいので、版ごとに取っておく
      - uses: actions/cache@v6
        with:
          path: ~/Library/org.swift.swiftpm/swift-sdks
          key: swift-sdk-android-${{ hashFiles('toolchains.toml') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Android/**/*.gradle.kts', 'Android/gradle/**') }}
      - name: Swift SDK for Android を入れる (取っておいたものがあれば使う)
        working-directory: Android
        run: mise run install-android-swift-sdk
      - run: mise run build-android
      - name: 振る舞いのテストの道具 (bun) を入れる
        working-directory: BehaviorTests
        run: mise install
      - run: mise run test-behavior
